<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
html,body{
    margin:0;
    padding:0;
    background:#ffffff;
    font-family:Segoe UI,Arial,sans-serif;
}

.widget{
    width:340px;
    border:1px solid #d0d0d0;
    border-radius:16px;
    padding:15px;
    box-sizing:border-box;
}

.titolo{
    text-align:center;
    font-size:20px;
    font-weight:700;
    margin-bottom:4px;
}

.zona{
    text-align:center;
    color:#666;
    font-size:13px;
    margin-bottom:12px;
}

.giorno{
    border-top:1px solid #e5e5e5;
    padding-top:10px;
    margin-top:10px;
}

.giorno:first-of-type{
    border-top:none;
    margin-top:0;
    padding-top:0;
}

.giorno-title{
    font-size:16px;
    font-weight:700;
    margin-bottom:8px;
    color:#222;
}

.riga{
    margin:6px 0;
    font-size:15px;
}

.badge{
    font-weight:700;
}

.verde{
    color:#2e7d32;
}

.giallo{
    color:#f9a825;
}

.arancione{
    color:#ef6c00;
}

.rosso{
    color:#c62828;
}

.footer{
    margin-top:12px;
    font-size:12px;
    color:#666;
    text-align:center;
}
</style>
</head>

<body>

<div class="widget">
    <div id="contenuto">
        Caricamento...
    </div>
</div>

<script>

function classeLivello(valore){

    if(!valore) return "verde";

    valore = valore.toLowerCase();

    if(valore.includes("ross")) return "rosso";
    if(valore.includes("aranc")) return "arancione";
    if(valore.includes("giall")) return "giallo";

    return "verde";
}

function livello(v){
    const c = classeLivello(v);

    return `<span class="badge ${c}">${v || "Verde"}</span>`;
}

function blocco(titolo,d){

    if(!d) return "";

    return `
        <div class="giorno">
            <div class="giorno-title">${titolo}</div>

            <div class="riga">
                🌊 Idraulico:
                ${livello(d.idraulico || d.hydraulic)}
            </div>

            <div class="riga">
                ⛈️ Temporali:
                ${livello(d.temporali || d.thunderstorms)}
            </div>

            <div class="riga">
                ⛰️ Idrogeologico:
                ${livello(d.idrogeologico || d.hydrogeological)}
            </div>
        </div>
    `;
}

async function aggiorna(){

    try{

        const response = await fetch(
            "https://allertameteo.app/api/alert/Milano"
        );

        const data = await response.json();

        const oggi =
            data.oggi ||
            data.today ||
            data.current ||
            null;

        const domani =
            data.domani ||
            data.tomorrow ||
            data.nextDay ||
            null;

        const comune =
            data.comune ||
            "Milano";

        const zona =
            data.zona ||
            data.alertZone ||
            "Nodo Idraulico di Milano";

        const aggiornamento =
            data.aggiornato ||
            data.updatedAt ||
            "";

        document.getElementById("contenuto").innerHTML = `
            <div class="titolo">${comune}</div>

            <div class="zona">${zona}</div>

            ${blocco("OGGI", oggi)}

            ${blocco("DOMANI", domani)}

            <div class="footer">
                ${aggiornamento}<br>
                Fonte: AllertaMeteo.app / Protezione Civile
            </div>
        `;

    }catch(err){

        document.getElementById("contenuto").innerHTML =
            "<b>Errore nel caricamento del bollettino</b>";

        console.error(err);
    }
}

aggiorna();
setInterval(aggiorna, 900000);

</script>

</body>
</html>
