<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Allerta Meteo Milano</title>

<style>

html,body{
    margin:0;
    padding:0;
    background:#ffffff;
    font-family:Segoe UI,Arial,sans-serif;
}

.widget{
    width:300px;
    height:300px;
    box-sizing:border-box;
    padding:14px;
    border:1px solid #d9d9d9;
    border-radius:12px;
    background:#ffffff;
}

.titolo{
    text-align:center;
    font-size:22px;
    font-weight:700;
}

.zona{
    text-align:center;
    font-size:11px;
    color:#666;
    margin-top:2px;
}

.semaforo{
    width:85px;
    height:85px;
    border-radius:50%;
    margin:12px auto;
    box-shadow:0 0 8px rgba(0,0,0,.15);
}

.stato{
    text-align:center;
    font-size:18px;
    font-weight:700;
    margin-bottom:12px;
}

.riga{
    font-size:13px;
    margin:7px 0;
}

.footer{
    margin-top:10px;
    padding-top:8px;
    border-top:1px solid #eeeeee;
    font-size:11px;
    color:#666;
    text-align:center;
}

.fonte{
    margin-top:4px;
    font-size:10px;
    color:#888;
    text-align:center;
}

</style>
</head>

<body>

<div class="widget">
    <div id="contenuto">
        Caricamento bollettino...
    </div>
</div>

<script>

function coloreAllerta(colore){

    switch((colore || "").toLowerCase()){

        case "rosso":
            return "#d32f2f";

        case "arancione":
            return "#ef6c00";

        case "giallo":
            return "#fbc02d";

        default:
            return "#2e7d32";
    }
}

async function aggiorna(){

    try{

        const response =
            await fetch("https://allertameteo.app/api/alert/Milano");

        const json = await response.json();

        const d = json.data;

        const colore = coloreAllerta(
            d.oggi.allerta.colore
        );

        document.getElementById("contenuto").innerHTML = `

            <div class="titolo">
                Milano
            </div>

            <div class="zona">
                ${d.zona}
            </div>

            <div class="semaforo"
                 style="background:${colore}">
            </div>

            <div class="stato"
                 style="color:${colore}">
                 ${d.oggi.allerta.descrizione}
            </div>

            <div class="riga">
                🌊 Idraulico
                <span style="color:${colore};font-weight:bold;">●</span>
            </div>

            <div class="riga">
                ⛈️ Temporali
                <span style="color:${colore};font-weight:bold;">●</span>
            </div>

            <div class="riga">
                ⛰️ Idrogeologico
                <span style="color:${colore};font-weight:bold;">●</span>
            </div>

            <div class="footer">
                ${d.bulletin_info.data_bollettino}
                &nbsp;
                ${d.bulletin_info.ora_bollettino}
            </div>

            <div class="fonte">
                Fonte: AllertaMeteo.app / Protezione Civile
            </div>

        `;

    }
    catch(err){

        document.getElementById("contenuto").innerHTML =
        "<div style='padding:20px;text-align:center'>Errore caricamento dati</div>";
    }
}

aggiorna();

setInterval(aggiorna, 900000);

</script>

</body>
</html>
